<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">OpenCode Setup logo</title>
  <desc id="d">A terminal window mark with an open angle bracket and a blinking cursor, next to the wordmark.</desc>
  <style>
    :root { --bg:#0f172a; --fg:#e2e8f0; --accent:#38bdf8; --sub:#94a3b8; }
    @media (prefers-color-scheme: light) { :root { --fg:#0f172a; --accent:#0284c7; --sub:#475569; } }
    .word { font: 700 56px ui-monospace, "SF Mono", "Cascadia Code", Consolas, "DejaVu Sans Mono", monospace; fill: var(--fg); }
    .sub  { font: 500 18px ui-monospace, "SF Mono", "Cascadia Code", Consolas, "DejaVu Sans Mono", monospace; fill: var(--sub); letter-spacing: 3px; }
    .blink { animation: b 1.1s steps(1) infinite; }
    @keyframes b { 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect x="20" y="30" width="140" height="140" rx="30" fill="var(--bg)"/>
  <rect x="20" y="30" width="140" height="140" rx="30" fill="none" stroke="url(#g)" stroke-width="5"/>
  <circle cx="44" cy="52" r="5" fill="#f87171"/><circle cx="60" cy="52" r="5" fill="#fbbf24"/><circle cx="76" cy="52" r="5" fill="#34d399"/>
  <path d="M74 88 L46 112 L74 136" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="blink" x="94" y="126" width="42" height="12" rx="3" fill="url(#g)"/>
  <text class="word" x="190" y="102">open<tspan fill="var(--accent)">code</tspan></text>
  <text class="sub" x="192" y="140">SETUP · WINDOWS · LINUX</text>
</svg>
